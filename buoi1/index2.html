<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Cá Nhân</title>
    <style>
        /* Reset CSS cơ bản để Box Model tính toán chuẩn xác */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
        }

        /* =======================================================
           PROMPT 1 (Layout tổng): CSS Grid & grid-template-areas
           ======================================================= */
        .portfolio-layout {
            display: grid;
            /* Sidebar rộng 250px, Main content chiếm phần còn lại (1fr) */
            grid-template-columns: 250px 1fr;
            grid-template-rows: auto 1fr auto;
            
            /* Quản lý bằng grid-template-areas theo đúng cấu trúc */
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
                
            min-height: 100vh;
            gap: 20px; /* Dùng gap hiện đại để tạo khoảng cách */
            padding: 20px;
        }

        .header {
            grid-area: header;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #bdc3c7;
            padding: 20px;
        }

        .main-content {
            grid-area: main;
            background-color: #ecf0f1;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* =======================================================
           PROMPT 2 (Skills Section): Flexbox, wrap, gap 15px
           ======================================================= */
        .skills {
            display: flex;
            flex-direction: row;     /* Hiển thị dạng hàng ngang */
            flex-wrap: wrap;         /* Tự động xuống dòng khi màn hình nhỏ */
            justify-content: center; /* Căn giữa các item */
            gap: 15px;               /* Khoảng cách giữa các item là 15px */
            margin-top: 20px;
        }

        .skill-item {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Container tổng quản lý bằng Grid -->
    <div class="portfolio-layout">
        
        <header class="header">
            <h1>Header</h1>
        </header>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Thông tin cá nhân...</p>
        </aside>

        <main class="main-content">
            <h2>Kỹ năng (Skills)</h2>
            <!-- Container con quản lý bằng Flexbox -->
            <div class="skills">
                <div class="skill-item">HTML</div>
                <div class="skill-item">CSS</div>
                <div class="skill-item">JS</div>
                <div class="skill-item">React</div>
                <div class="skill-item">Python</div>
                <div class="skill-item">Figma</div>
            </div>
        </main>

        <footer class="footer">
            <p>Footer</p>
        </footer>

    </div>
</body>
</html>
